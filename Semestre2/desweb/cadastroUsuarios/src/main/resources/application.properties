spring.application.name=cadastroUsuarios

# Porta da aplicação
server.port=8081

# Configurações do MySQL (ajuste o nome do banco, usuário e senha se necessário)
spring.datasource.url=jdbc:mysql://localhost:3306/cadastro_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cria ou atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true