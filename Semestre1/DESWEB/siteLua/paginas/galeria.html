<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ryan Dias da Silva">
    <meta name="description" content="Galeria do Site Lunático com imagens de diferentes luas do sistema solar, incluindo a Lua, Phobos, Deimos e Europa.">
    <meta name="keywords" content="galeria, imagens do espaço, luas do sistema solar, Lua, Phobos, Deimos, Europa, astronomia">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="icon" href="../img/moon.png">
    <link rel="stylesheet" href="../css/galeria.css">
    <title>Site Lunático</title>
</head>
<body>
    <div class="container" ></div>
        <header>
            <h1>Galeria</h1>
            <h2>Aqui você encontra algumas das imagens utilizadas no site!</h2>
        </header>
        <main>
            <div class="caixa">
                <section>
                    <p>Foto da superfície da Lua</p>
                    <img src="../img/moonCloseUp.jpg" alt="">
                </section>
                <section>
                    <p>Foto da superfície de Deimos</p>
                    <img src="../img/deimosClose.png" alt="">
                </section>
            </div>
            <div class="caixa2">
                <section>
                    <p>Foto da superfície de Phobos (meramente ilustrativa)</p>
                    <img src="../img/phobosDoom.png" alt="">
                </section>
                <section>
                    <p>Simulação de como seria estar na superfície de Europa</p>
                    <img src="../img/europeClose.png" alt="">
                </section>
            </div>
        </main>
        <div class="caixaMajora">
            <img class="majora" src="../img/majoraMoon.png" alt="">
            <img class="top" src="../img/top.png" alt="">
        </div>
        <footer>Indaiatuba, 26 de fevereiro de 2026</footer>

        <a class="voltar" href="../index.html"> <i class="bi bi-house"></i> Página inicial</a>
    </div>
</div>
</body>
</html>
